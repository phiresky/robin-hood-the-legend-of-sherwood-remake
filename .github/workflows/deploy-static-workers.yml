name: Verify and manually deploy static Workers

on:
  pull_request:
    paths:
      - wasm-www/**
      - crates/robin_identity_signer/**
      - crates/robin_run_protocol/**
      - crates/robin_rs/js/browser_identity_*.js
      - crates/robin_rs/src/leaderboard_signing.rs
      - scripts/build_identity_signer.sh
      - scripts/install_pinned_wasm_bindgen.sh
      - .github/workflows/deploy-static-workers.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy public site and identity signer to Cloudflare
        required: true
        default: false
        type: boolean
      runtime_version_id:
        description: Live robinhood-runtime-assets Worker version UUID
        required: false
        type: string
      datadir_version_id:
        description: Live robinhood-datadir-assets Worker version UUID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: static-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24.19.0
          working-directory: wasm-www
          cache: true
          install: false
      - working-directory: wasm-www
        run: pnpm install --frozen-lockfile
      - name: Install pinned wasm-bindgen
        id: wasm-bindgen
        run: |
          destination="${RUNNER_TEMP}/wasm-bindgen-cli-0.2.128"
          executable="$(scripts/install_pinned_wasm_bindgen.sh "${destination}")"
          test "$("${executable}" --version)" = 'wasm-bindgen 0.2.128'
          echo "executable=${executable}" >> "${GITHUB_OUTPUT}"
      - name: Test, build and verify public and signer origins
        working-directory: wasm-www
        env:
          ROBINHOOD_WASM_BINDGEN: ${{ steps.wasm-bindgen.outputs.executable }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:leaderboards
          pnpm test:deployment
          pnpm verify:deployment-config
          pnpm build:site
          pnpm verify:public
          pnpm build:signer
          pnpm verify:signer
          pnpm verify:wrangler

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: cloudflare-production
      url: https://robinhood.phiresky.xyz/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24.19.0
          working-directory: wasm-www
          cache: true
          install: false
      - working-directory: wasm-www
        run: pnpm install --frozen-lockfile
      - name: Install pinned wasm-bindgen
        id: wasm-bindgen
        run: |
          destination="${RUNNER_TEMP}/wasm-bindgen-cli-0.2.128"
          executable="$(scripts/install_pinned_wasm_bindgen.sh "${destination}")"
          test "$("${executable}" --version)" = 'wasm-bindgen 0.2.128'
          echo "executable=${executable}" >> "${GITHUB_OUTPUT}"
      - name: Build, verify and deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROBINHOOD_WASM_BINDGEN: ${{ steps.wasm-bindgen.outputs.executable }}
          ROBINHOOD_RUNTIME_VERSION_ID: ${{ inputs.runtime_version_id }}
          ROBINHOOD_DATADIR_VERSION_ID: ${{ inputs.datadir_version_id }}
        run: wasm-www/scripts/deploy-cloudflare.sh
