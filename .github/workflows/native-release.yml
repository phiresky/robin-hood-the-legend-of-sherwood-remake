name: Native release

on:
  push:
    tags: ["v[0-9]*"]
  pull_request:
  schedule:
    # GitHub schedules are UTC. The change-detection job prevents unchanged
    # commits from rebuilding or replacing the rolling nightly release.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Optional SemVer package version (defaults to a CI prerelease)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  # The checked-in native Linux linker settings are optimized for local
  # development and reference Wild. Use the runner's portable defaults in CI.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
  # RUSTFLAGS has higher precedence than target-specific Cargo config, so it
  # replaces (rather than combines with) the local `--ld-path=wild` flag.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"
  VPK_VERSION: 1.2.0

jobs:
  changes:
    name: Check for nightly changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Compare with last successful nightly run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != schedule ]]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          previous_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/native-release.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""'
          )"
          if [[ -n "${previous_sha}" && "${previous_sha}" == "${GITHUB_SHA}" ]]; then
            echo "No repository changes since the last successful nightly (${GITHUB_SHA})."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Nightly build required: ${previous_sha:-<none>} -> ${GITHUB_SHA}."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  package:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-2022
            runtime: win-x64
            executable: robin.exe
            artifact: robin-windows-x86_64
          - name: Linux x86-64
            os: ubuntu-22.04
            runtime: linux-x64
            executable: robin
            artifact: robin-linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install pinned Velopack CLI
        shell: bash
        run: |
          dotnet tool install --global vpk --version "${VPK_VERSION}"
          vpk --help

      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            base_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "robin_rs") | .version')"
            version="${base_version}-nightly.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:12}"
          else
            base_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "robin_rs") | .version')"
            version="${base_version}-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:12}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer package version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        shell: bash
        run: |
          # TODO: Bundle FFmpeg DLLs on Windows, then restore the default
          # `video` feature for packaged builds.
          cargo build --locked --release --no-default-features --features native-fs,audio -p robin_rs --bin robin

      - name: Stage package input
        shell: bash
        run: |
          mkdir -p target/package-input target/release-assets
          cp "target/release/${{ matrix.executable }}" target/package-input/
          cp README.md target/package-input/

      - name: Create Windows standalone binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/package-input/* -DestinationPath target/release-assets/robin-windows-x86_64.zip

      - name: Create Linux standalone binary
        if: runner.os == 'Linux'
        run: tar -C target/package-input -czf target/release-assets/robin-linux-x86_64.tar.gz robin README.md

      - name: Build Windows Velopack installers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # TODO: Add Authenticode signing when repository signing credentials
          # are provisioned; unsigned public installers trigger OS warnings.
          vpk pack \
            --packId io.github.phiresky.robinhood \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir target/package-input \
            --mainExe robin.exe \
            --packTitle "Robin Hood - The Legend of Sherwood" \
            --runtime win-x64 \
            --msi \
            --outputDir target/velopack
          cp target/velopack/* target/release-assets/

      - name: Build Linux Velopack AppImage
        if: runner.os == 'Linux'
        run: |
          vpk pack \
            --packId io.github.phiresky.robinhood \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir target/package-input \
            --mainExe robin \
            --packTitle "Robin Hood - The Legend of Sherwood" \
            --runtime linux-x64 \
            --outputDir target/velopack
          cp target/velopack/* target/release-assets/

      - name: List release assets
        shell: bash
        run: find target/release-assets -maxdepth 1 -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Velopack's feed files and nupkgs are retained in the per-platform
          # Actions artifacts. Publish only end-user downloads here, avoiding
          # collisions between same-named Windows and Linux feed files.
          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name 'robin-*.zip' -o \
              -name 'robin-*.tar.gz' -o \
              -iname '*portable.zip' -o \
              -iname '*setup.exe' -o \
              -iname '*.msi' -o \
              -iname '*.AppImage' \
            \) -print0
          )
          if (( ${#assets[@]} == 0 )); then
            echo "No end-user release assets were downloaded." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            release_tag=nightly
            release_title="Nightly $(date -u +%Y-%m-%d)"
            if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh api \
                --method PATCH \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true >/dev/null
              gh release upload "${release_tag}" "${assets[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
              gh release edit "${release_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${release_title}" \
                --notes "Automated nightly build of ${GITHUB_SHA}." \
                --prerelease
            else
              gh release create "${release_tag}" "${assets[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "${release_title}" \
                --notes "Automated nightly build of ${GITHUB_SHA}." \
                --prerelease
            fi
          elif gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --generate-notes \
              --verify-tag
          fi
