name: Publish WASM binaries

on:
  workflow_dispatch:
    inputs:
      demo_content_identity_sha256:
        description: Exact native Demo Data/locale closure digest
        required: true
        type: string
      full_content_manifest_sha256:
        description: Exact local Full web-content manifest digest (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wasm-binaries
  cancel-in-progress: false

env:
  BINARIES_REPO: phiresky/robin-hood-the-legend-of-sherwood-remake-binaries
  BINARIES_BRANCH: gh-pages
  RUSTC_WRAPPER: ""
  # Host-native builds in this job (`cargo install wasm-bindgen-cli` runs from
  # the checkout and reads .cargo/config.toml) must not use the local Wild
  # linker driver script.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml pins the wasm target and rust-src (for
        # -Zbuild-std) alongside the compiler.
        run: rustup show active-toolchain

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-binaries

      - name: Install wasm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen clang wabt
          # Prebuilt wasm-bindgen CLI matching the Cargo.lock version (the
          # JS glue must stay in lockstep with the wasm-bindgen crate);
          # downloading the musl release binary avoids compiling the CLI
          # from source on every dispatch.
          WASM_BINDGEN_VERSION="$(
            awk '
              $0 == "name = \"wasm-bindgen\"" { found = 1; next }
              found && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.lock
          )"
          curl -fsSL --retry 3 \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" \
            /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Build release wasm
        # Threaded (atomics + shared memory) build: the extra rustflags in
        # scripts/wasm-threads.cargo-config.toml merge with the base
        # .cargo/config.toml wasm flags, and the `wasm-threads` feature turns
        # on the wasm-bindgen-rayon worker pool for parallel VQ sprite decode
        # (with a compiled-in serial fallback for pages that are not
        # cross-origin isolated).
        run: |
          cargo build --config scripts/wasm-threads.cargo-config.toml \
            -Zbuild-std=std,panic_abort \
            --target wasm32-unknown-unknown \
            --profile wasm-release \
            --no-default-features \
            --features audio,wasm-threads \
            -p robin_rs --bin robin

      - name: Build memory-capped replay validator wasm
        # Deliberately separate from the threaded 4 GiB-max game artifact.
        # This module is loaded only in a short-lived Dedicated Worker.
        run: |
          cargo build --config scripts/replay-admission-wasm.cargo-config.toml \
            -Zbuild-std=std,panic_abort \
            --target wasm32-unknown-unknown \
            --profile wasm-release \
            -p robin_replay_admission_wasm

      - name: Stage versioned artifact
        id: stage
        env:
          DEMO_CONTENT_IDENTITY_SHA256: ${{ inputs.demo_content_identity_sha256 }}
          FULL_CONTENT_MANIFEST_SHA256: ${{ inputs.full_content_manifest_sha256 }}
        run: |
          short="$(git rev-parse --short=12 HEAD)"
          commit="$(git rev-parse HEAD)"
          publish_root="target/wasm-binary-pages/wasm"
          artifact="${publish_root}/${short}"
          mkdir -p "${artifact}"

          wasm-bindgen \
            --target web \
            --out-dir "${artifact}" \
            --out-name robin \
            target/wasm32-unknown-unknown/wasm-release/robin.wasm

          wasm-bindgen \
            --target web \
            --out-dir "${artifact}" \
            --out-name replay_admission \
            target/wasm32-unknown-unknown/wasm-release/robin_replay_admission_wasm.wasm

          optimized_wasm="${RUNNER_TEMP}/robin_bg.opt.wasm"
          # --enable-simd: the module contains simd128 instructions (see
          # [target.wasm32-unknown-unknown] rustflags in .cargo/config.toml);
          # explicit rather than relying on target_features section detection.
          # --enable-threads/--enable-bulk-memory: required to parse the
          # shared-memory atomics module of the wasm-threads build.
          wasm-opt \
            -Oz \
            --enable-simd \
            --enable-threads \
            --enable-bulk-memory \
            --strip-debug \
            --strip-dwarf \
            -o "${optimized_wasm}" \
            "${artifact}/robin_bg.wasm"
          mv "${optimized_wasm}" "${artifact}/robin_bg.wasm"
          wasm-strip "${artifact}/robin_bg.wasm"

          replay_validator_opt="${RUNNER_TEMP}/replay_admission_bg.opt.wasm"
          wasm-opt \
            -Oz \
            --enable-simd \
            --strip-debug \
            --strip-dwarf \
            -o "${replay_validator_opt}" \
            "${artifact}/replay_admission_bg.wasm"
          mv "${replay_validator_opt}" "${artifact}/replay_admission_bg.wasm"
          wasm-strip "${artifact}/replay_admission_bg.wasm"
          scripts/assert-replay-admission-wasm-memory.sh \
            "${artifact}/replay_admission_bg.wasm"

          smoke_wasm_artifact() {
            node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              // The wasm-bindgen-rayon worker snippet references the Web
              // Worker global scope alias at module scope; give node one.
              globalThis.self = globalThis;
              const artifact = process.argv[1];
              const wasm = await import(`file://${process.cwd()}/${artifact}/robin.js`);
              const bytes = await readFile(`${artifact}/robin_bg.wasm`);
              await wasm.default({ module_or_path: bytes });
            ' "$1"
          }

          smoke_wasm_artifact "${artifact}"

          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const artifact = process.argv[1];
            const validator = await import(`file://${process.cwd()}/${artifact}/replay_admission.js`);
            const bytes = await readFile(`${artifact}/replay_admission_bg.wasm`);
            await validator.default({ module_or_path: bytes });
            try {
              validator.validate_compact_replay("not-a-replay");
              throw new Error("validator accepted malformed replay");
            } catch (error) {
              if (String(error).includes("accepted malformed")) throw error;
            }
          ' "${artifact}"

          # GitHub Pages does not apply Content-Encoding to repository files.
          # Publish deterministic precompressed siblings; the web shell uses
          # DecompressionStream and falls back to the plain files for older
          # builds and browsers.
          gzip -9 -n -k "${artifact}/robin.js" "${artifact}/robin_bg.wasm"

          python3 - <<'PY' "${artifact}"
          import json
          import shutil
          import sys
          from pathlib import Path

          artifact = Path(sys.argv[1])
          entries = []
          core_root = Path("assets/core-datadir")
          required = [core_root / "Data/Interface/Fonts/arial.ttf"]
          required.extend(sorted((core_root / "Data/Interface/UI").glob("*.png")))
          for src in required:
              if not src.is_file():
                  raise SystemExit(f"required web overlay asset is missing: {src}")
              rel = src.relative_to(core_root)
              dst = artifact / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              path = rel.as_posix()
              entries.append({"path": path, "url": path})
          (artifact / "preload-assets.json").write_text(
              json.dumps(entries, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          wasm_sha="$(sha256sum "${artifact}/robin_bg.wasm" | cut -d ' ' -f 1)"
          wasm_gzip_sha="$(sha256sum "${artifact}/robin_bg.wasm.gz" | cut -d ' ' -f 1)"
          replay_admission_sha="$(sha256sum "${artifact}/replay_admission_bg.wasm" | cut -d ' ' -f 1)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          demo_url="https://robinhood.phiresky.xyz/datadirs/demo-leicester/v8-web-opus-q80.rhdata.zst"
          curl -fsSL --retry 3 "${demo_url}" -o "${RUNNER_TEMP}/multiplayer-demo.rhdata.zst"
          demo_sha="$(sha256sum "${RUNNER_TEMP}/multiplayer-demo.rhdata.zst" | cut -d ' ' -f 1)"
          demo_bytes="$(stat -c %s "${RUNNER_TEMP}/multiplayer-demo.rhdata.zst")"
          if [[ ! "${DEMO_CONTENT_IDENTITY_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "demo_content_identity_sha256 must be one lowercase SHA-256 digest" >&2
            exit 1
          fi
          if [[ -n "${FULL_CONTENT_MANIFEST_SHA256}" ]]; then
            if [[ ! "${FULL_CONTENT_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "full_content_manifest_sha256 must be one lowercase SHA-256 digest" >&2
              exit 1
            fi
            full_content="{ \"manifestSha256\": \"${FULL_CONTENT_MANIFEST_SHA256}\" }"
          else
            full_content="null"
          fi

          cat > "${artifact}/manifest.json" <<EOF
          {
            "commit": "${commit}",
            "short": "${short}",
            "builtAt": "${built_at}",
            "netProtocol": 25,
            "ticketSchema": 3,
            "multiplayerContent": {
              "schema": 2,
              "demo": {
                "url": "${demo_url}",
                "sha256": "${demo_sha}",
                "byteLength": ${demo_bytes},
                "nativeContentSha256": "${DEMO_CONTENT_IDENTITY_SHA256}"
              },
              "full": ${full_content}
            },
            "files": {
              "js": "robin.js",
              "jsGzip": "robin.js.gz",
              "wasm": "robin_bg.wasm",
              "wasmGzip": "robin_bg.wasm.gz",
              "replayAdmissionJs": "replay_admission.js",
              "replayAdmissionWasm": "replay_admission_bg.wasm"
            },
            "sha256": {
              "wasm": "${wasm_sha}",
              "wasmGzip": "${wasm_gzip_sha}",
              "replayAdmissionWasm": "${replay_admission_sha}"
            }
          }
          EOF
          cp "${artifact}/manifest.json" "${publish_root}/latest.json"
          echo "short=${short}" >> "${GITHUB_OUTPUT}"

      - name: Checkout binaries Pages branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BINARIES_REPO }}
          ref: ${{ env.BINARIES_BRANCH }}
          token: ${{ secrets.BINARIES_REPO_TOKEN }}
          path: binary-pages

      - name: Publish to binaries repo
        working-directory: binary-pages
        run: |
          short="${{ steps.stage.outputs.short }}"
          mkdir -p wasm
          rm -rf "wasm/${short}"
          cp -R "../target/wasm-binary-pages/wasm/${short}" "wasm/${short}"
          cp ../target/wasm-binary-pages/wasm/latest.json wasm/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm
          if git diff --cached --quiet; then
            echo "No binary changes to publish."
            exit 0
          fi
          git commit -m "Publish wasm ${short}"
          git push origin "HEAD:${BINARIES_BRANCH}"
