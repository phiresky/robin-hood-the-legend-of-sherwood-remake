name: Rust quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The checked-in wrapper and linker are local development tools that are not
  # available on GitHub-hosted runners; the linker override replaces the Wild
  # driver script. The cfg-based `target-cpu=x86-64-v3` baseline from
  # .cargo/config.toml still applies — do NOT set RUSTFLAGS here, it would
  # replace (not merge with) that baseline.
  RUSTC_WRAPPER: ""
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        # rustfmt is pinned in rust-toolchain.toml.
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libdbus-1-dev \
            libswresample-dev \
            libswscale-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: tests

      - name: Run tests
        run: cargo test --locked
