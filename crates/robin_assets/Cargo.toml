[package]
name = "robin_assets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_assets"

# Wasm sprite-decode benchmark (see the example header for build/run steps).
# cdylib so wasm-bindgen can process it; native profiles compile it to an
# empty library (the whole file is cfg(target_arch = "wasm32")).
[[example]]
name = "wasm_decode_bench"
crate-type = ["cdylib"]

[[example]]
name = "boot_inventory"
required-features = ["engine-adapters"]

[[example]]
name = "trim_browser_boot"
required-features = ["engine-adapters"]

[[example]]
name = "jxl_sprite_probe"
required-features = ["engine-adapters", "research"]

[[example]]
name = "asset_decode_bench"
required-features = ["engine-adapters"]

[[example]]
name = "rechunk_sprite_groups"
required-features = ["engine-adapters"]

[[test]]
name = "vm_integration"
required-features = ["engine-adapters"]

[[test]]
name = "script_manager_integration"
required-features = ["engine-adapters"]

[dependencies]
robin_asset_codecs.workspace = true
robin_content.workspace = true
robin_util.workspace = true
robin_data_io.workspace = true
robin_engine = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
tracing.workspace = true
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
flate2 = "1"
crc32fast = "1.5"
bitcode.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
png = { workspace = true, optional = true }
zstd.workspace = true
# Pure-Rust AVIF container parser: dimensions / alpha presence of web-recipe
# AVIF images without decoding pixels (the browser decodes them; see
# `browser_images`).
avif-parse = "2.1.0"

# `bzip2` is only needed when reading legacy 16-bit picture data
# (`.bfn` glyph tables, loose `.res` archives shipped by the original
# game).  The shipping datadir format is zstd end-to-end, so wasm builds
# — which only consume shipping blobs — don't pull this in.  The
# pure-Rust `libbz2-rs-sys` backend also trips a `set_len > capacity`
# UB check on wasm32 inside its spare-capacity handling; keeping the
# dep native-only dodges that entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Official libjxl Rust port (https://github.com/libjxl/jxl-rs). NATIVE ONLY:
# loose mod terrain (`.map` written by cjxl, e.g. mods/multi-team-demos) and
# offline tools still use JPEG XL, but the web build ships AVIF decoded by
# the browser, so the wasm runtime does not link a JXL decoder. SIMD
# (default features) is ON: the Cranelift dev profiles can't compile its
# AVX512 intrinsics, so the workspace Cargo.toml builds the jxl crates with
# the LLVM backend there (same treatment as crc32fast).
jxl = "0.7.1"
# Pure-Rust AV1 decoder (the memorysafety port of dav1d) for AVIF assets on
# native desktop/Android and in the converter's quality gates. NATIVE ONLY:
# the web build uses the browser's AVIF decoder. `asm` is off so no
# nasm/cross assembler is needed for the MinGW and Android builds; native
# decodes only mod terrain and converter gates, where speed is secondary.
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8"] }
# Parallel VQ chunk decode at mission install. Native only: wasm builds run
# the serial path (no thread pool without atomics).
rayon = "1"
bzip2 = "0.6"
# Memory-maps the ~600 MB sprite bank so mission load doesn't read or
# copy it; sprites fault their pages in on first draw.
memmap2 = "0.9"

# tempfile has no wasm32-unknown-unknown support; the tests that use it are
# native-only anyway, and gating it keeps `--example wasm_decode_bench`
# buildable for wasm (cargo builds every dev-dependency for example targets).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen.workspace = true

# Browser thread pool for parallel VQ chunk decode (feature `wasm-threads`).
# The build must also enable `-C target-feature=+atomics,+bulk-memory,
# +mutable-globals` with `-Zbuild-std` and shared memory — see
# `scripts/build-wasm-threads.sh`; a plain wasm build without the feature is
# unchanged. wasm-bindgen-rayon is pinned exactly: its JS worker snippet is
# post-processed by the deploy pipeline, so silent minor bumps must not
# reshape it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"], optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = { workspace = true, optional = true }
# Global allocator for every wasm build (src/wasm_alloc.rs): std's dlmalloc
# funnels every thread through one futex lock, which measurably INVERTS
# worker-pool decode scaling past ~4 threads, and talc is ~9% faster even
# single-threaded on the sprite-decode corpus. Pinned exactly: a global
# allocator swap should never ride in on an unrelated `cargo update`.
talc = "=5.1.1"
spinning_top = "0.3"

[features]
default = ["engine-adapters"]
# Expensive offline experiments are built only when explicitly requested.
research = []
# Game-level preparation, VM tooling and resource-manager adapters. Raw sprite,
# picture and compression codecs remain usable without the simulation crate.
engine-adapters = ["dep:robin_engine", "dep:png"]
# Threaded sprite decode on wasm32 (rayon worker pool via wasm-bindgen-rayon).
# Requires an atomics + shared-memory build; without pool initialization at
# runtime the decode paths fall back to serial.
wasm-threads = [
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:futures-channel",
    "dep:futures-util",
]

[lints]
workspace = true

[[example]]
name = "migrate_picture_metadata"
required-features = ["engine-adapters"]

[[example]]
name = "mission_sprite_audit"
required-features = ["engine-adapters"]

[dev-dependencies]
robin_test_support.workspace = true
clap = { workspace = true, features = ["derive"] }
