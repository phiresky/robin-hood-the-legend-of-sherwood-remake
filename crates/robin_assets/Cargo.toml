[package]
name = "robin_assets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_assets"

[dependencies]
robin_util.workspace = true
robin_engine.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tracing.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
flate2 = "1"
bitcode.workspace = true
serde_json.workspace = true
zstd.workspace = true
winit = { version = "0.30", default-features = false, features = ["serde"] }
# Official libjxl Rust port (https://github.com/libjxl/jxl-rs). Used to
# decode terrain `.map` files when the converter has transcoded them to
# JPEG XL. Disable default SIMD because this workspace currently uses
# Cranelift in dev builds, and jxl's default AVX512 path hits unsupported
# intrinsics there.
jxl = { version = "0.4", default-features = false }

# `bzip2` is only needed when reading **legacy** SBPictureSixteen data
# (`.bfn` glyph tables, loose `.res` archives shipped by the original
# game).  The shipping datadir format is zstd end-to-end, so wasm builds
# — which only consume shipping blobs — don't pull this in.  The
# pure-Rust `libbz2-rs-sys` backend also trips a `set_len > capacity`
# UB check on wasm32 inside its spare-capacity handling; keeping the
# dep native-only dodges that entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bzip2 = "0.6"

[dev-dependencies]
tempfile.workspace = true

# The library keeps winit platform-neutral for wasm consumers. Standalone
# Linux test targets still need one native backend selected so winit compiles.
[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
