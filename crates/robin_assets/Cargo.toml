[package]
name = "robin_assets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_assets"

# Wasm sprite-decode benchmark (see the example header for build/run steps).
# cdylib so wasm-bindgen can process it; native profiles compile it to an
# empty library (the whole file is cfg(target_arch = "wasm32")).
[[example]]
name = "wasm_decode_bench"
crate-type = ["cdylib"]

[dependencies]
robin_util.workspace = true
robin_engine.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tracing.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
flate2 = "1"
# Fast non-cryptographic hasher for the sprite codec's context maps (hot
# path: several map lookups per decoded tile).
foldhash = "0.2"
bitcode.workspace = true
serde_json.workspace = true
zstd.workspace = true
# Official libjxl Rust port (https://github.com/libjxl/jxl-rs). Used to
# decode terrain `.map` files when the converter has transcoded them to
# JPEG XL. Disable default SIMD because this workspace currently uses
# Cranelift in dev builds, and jxl's default AVX512 path hits unsupported
# intrinsics there.
jxl = { version = "0.6", default-features = false }

# `bzip2` is only needed when reading **legacy** SBPictureSixteen data
# (`.bfn` glyph tables, loose `.res` archives shipped by the original
# game).  The shipping datadir format is zstd end-to-end, so wasm builds
# — which only consume shipping blobs — don't pull this in.  The
# pure-Rust `libbz2-rs-sys` backend also trips a `set_len > capacity`
# UB check on wasm32 inside its spare-capacity handling; keeping the
# dep native-only dodges that entirely.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Parallel VQ chunk decode at mission install. Native only: wasm builds run
# the serial path (no thread pool without atomics).
rayon = "1"
bzip2 = "0.6"
# Memory-maps the ~600 MB sprite bank so mission load doesn't read or
# copy it; sprites fault their pages in on first draw.
memmap2 = "0.9"

# tempfile has no wasm32-unknown-unknown support; the tests that use it are
# native-only anyway, and gating it keeps `--example wasm_decode_bench`
# buildable for wasm (cargo builds every dev-dependency for example targets).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
# PNG export for the jxl_sprite_probe research example (cjxl input files).
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[lints]
workspace = true
