[package]
name = "robin_engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_engine"

[features]
default = []
# Expose `Engine::test_set_*` helpers on the facade for cross-crate
# round-trip tests.  Enabled via `[dev-dependencies]` in `robin_rs`
# so production builds keep the minimal sim-mutation surface.
test-helpers = []
# Explicit reconstruction authority for the Original parity tool. Never add
# this to a gameplay feature bundle: it permits mutations outside frame admission.
original-parity = []

[dependencies]
robin_level_data.workspace = true
robin_legacy_save.workspace = true
robin_script_types.workspace = true
robin_engine_types.workspace = true
serde-value.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde_json_any_key = "2"
tracing.workspace = true
thiserror.workspace = true
# Drop-in for `std::time::{Instant, SystemTime}` that works on
# `wasm32-unknown-unknown`.  std's types compile fine for that target
# but `Instant::now()` panics at runtime with "time not implemented
# on this platform"; web-time uses `performance.now()` instead.
web-time.workspace = true
fastrand.workspace = true
bitflags = { workspace = true, features = ["serde"] }
num_enum = "0.7"
strum = "0.28.0"
strum_macros = "0.28.0"
geo = { workspace = true, features = ["serde"] }
i_overlay = "8.1.1"
robin_util.workspace = true
robin_data_io.workspace = true
robin_state_hash_derive.workspace = true
# Plain run-identity types only; the signed leaderboard protocol
# (robin_run_protocol) must stay out of the simulation dependency graph.
robin_run_types.workspace = true
sha2.workspace = true
nonmax = { workspace = true, features = ["serde"] }
bitcode.workspace = true
zstd.workspace = true
enum-map = { workspace = true, features = ["serde"] }
indexmap = { workspace = true, features = ["serde"] }
smart-default = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
cpu-time = "1"
robin_test_support.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
syn = { workspace = true, features = ["full", "visit"] }

[lints]
workspace = true
