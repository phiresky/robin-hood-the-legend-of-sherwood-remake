[package]
name = "robin_highscores"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Raw database access for corruption/concurrency fixtures; never enable in deployment builds.
test-support = []

[[test]]
name = "router_e2e"
required-features = ["test-support"]

[lib]
name = "robin_highscores"
path = "src/lib.rs"

[[bin]]
name = "robin-highscores-server"
path = "src/main.rs"

[[bin]]
name = "robin-highscores-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "robin-highscores-admin"
path = "src/bin/admin.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
bytes = "1"
cap-std = "4.0.3"
clap = { workspace = true, features = ["derive", "env"] }
command-fds = "0.3.3"
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
ipnet = "2"
rand.workspace = true
hmac = "0.13"
robin_run_protocol = { workspace = true, features = ["authentication"] }
robin_engine.workspace = true
robin_util.workspace = true
robin_replay_format.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { workspace = true, features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["cors", "request-id", "set-header", "timeout", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml.workspace = true
unicode-normalization = "0.1"
url.workspace = true
uuid = { version = "1", features = ["serde", "v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix_legacy = { package = "nix", version = "0.29", features = ["fs"] }
sd-notify = "0.5"

[target.'cfg(not(unix))'.dependencies]
# Unix authority uses rustix; retain the existing Windows capacity/lock backend.
fs2.workspace = true

[dev-dependencies]
# Independent compatibility oracle for persisted HMAC authorities and cursors.
ring = "0.17"
bitcode.workspace = true
http-body-util = "0.1"
tracing-test = "0.2"

[lints]
workspace = true
