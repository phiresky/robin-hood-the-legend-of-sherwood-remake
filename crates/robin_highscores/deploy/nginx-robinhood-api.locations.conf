# robin-highscores-api-contract-v1
# Included only by the root-installed TLS vhost. Its allow/deny boundary means
# this origin can trust Cloudflare to overwrite CF-Connecting-IP. The Rust API
# then accepts exactly one canonical X-Forwarded-For value from loopback nginx.

client_max_body_size 130m;

location = /api {
    if ($http_cf_connecting_ip = "") { return 403; }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
}

location ^~ /api/ {
    if ($http_cf_connecting_ip = "") { return 403; }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
}

location = /healthz {
    if ($http_cf_connecting_ip = "") { return 403; }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /readyz {
    if ($http_cf_connecting_ip = "") { return 403; }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# Cloudflare Workers Static Assets owns every other public path. Reaching this
# origin for one is a routing error, never a static-site fallback.
location / {
    return 404;
}
