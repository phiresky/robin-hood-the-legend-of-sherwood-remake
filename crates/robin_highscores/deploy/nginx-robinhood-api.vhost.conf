# robin-highscores-api-vhost-v1
server {
    listen 80;
    listen [::]:80;
    server_name robinhood.phiresky.xyz;

    include /etc/nginx/snippets/robinhood-cloudflare-only.conf;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name robinhood.phiresky.xyz;

    include /etc/nginx/snippets/robinhood-cloudflare-only.conf;
    ssl_certificate /etc/letsencrypt/live/robinhood.phiresky.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robinhood.phiresky.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:robinhood_api_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robinhood-Origin "api-v1" always;

    include /etc/nginx/snippets/robinhood-api.locations.conf;
}
