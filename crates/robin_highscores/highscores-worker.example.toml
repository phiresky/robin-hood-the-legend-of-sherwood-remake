# Example verifier-worker configuration. Production uses ops/production/worker.toml.
server_config = "/home/robinhood/.config/robin-highscores/server.toml"
worker_id = "worker-01"
poll_interval_ms = 500
lease_seconds = 210
retry_seconds = 30
max_verifier_attempts = 3

[verifier_launcher]
bwrap_program = "/usr/bin/bwrap"
prlimit_program = "/usr/bin/prlimit"
# Static musl verifier of the verifier release named by the `authority` symlink.
verifier_program = "/home/robinhood/.local/opt/robin-highscores/authority/bin/robin-replay-verifier"
wall_timeout_seconds = 120
cpu_limit_seconds = 120
address_space_limit_bytes = 1073741824
process_limit = 32
open_files_limit = 128
file_size_limit_bytes = 134217728

[limits]
max_input_bytes = 16777216
max_compressed_bytes = 16777216
max_decompressed_bytes = 67108864
max_campaign_bytes = 67108864
max_frames = 2000000
max_version_bytes = 256
max_mission_id_bytes = 128
max_entries_per_frame = 1024

# Raw Demo and Full trees are never bundled; install them read-only by hand.
[content.demo]
root = "/home/robinhood/.local/share/robin-highscores/raw-content/demo"
resource_locale_root = "1033"

[content.full]
root = "/home/robinhood/.local/share/robin-highscores/raw-content/full"
resource_locale_root = "2047"
