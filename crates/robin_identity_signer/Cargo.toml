[package]
name = "robin_identity_signer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
robin_run_protocol.workspace = true
wasm-bindgen.workspace = true
# Async extern bindings expand to wasm_bindgen_futures::JsFuture.
# This dependency is used by generated code even without a source-level path.
wasm-bindgen-futures.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
# Compatibility marker for the signed build-identity feature tuple.
# This package always contains only the isolated bridge, never the game.
identity-signer-bridge = []

[[bin]]
name = "leaderboard_identity_bridge"
path = "src/bin/leaderboard_identity_bridge.rs"
test = false

[lints]
workspace = true
