[package]
name = "robin_lua"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_lua"

[dependencies]
robin_engine.workspace = true
robin_util.workspace = true
# Luau is vendored by default, so no system Lua or `vendored` feature is
# needed. `send` lets the script host move across rollback boundaries, while
# Luau's `Lua::sandbox` isolates arbitrary downloaded missions.
mlua.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
# Used by the `check_mod_lua` example to walk downloaded mission
# zips. Examples reuse dev-dependencies, so this stays out of the
# library's release-mode dep graph.
zip.workspace = true

[lints]
workspace = true
