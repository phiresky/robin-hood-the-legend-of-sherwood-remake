[package]
name = "robin_manifest_tool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_manifest_tool"
path = "src/lib.rs"

[[bin]]
name = "robin-highscores-manifestctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bitcode.workspace = true
clap = { workspace = true, features = ["derive"] }
goblin = "0.10"
robin_assets.workspace = true
robin_engine.workspace = true
robin_run_protocol.workspace = true
robin_util.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
wait-timeout = "0.2"

[lints]
workspace = true
