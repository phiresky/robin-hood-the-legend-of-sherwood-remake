[package]
name = "robin_manifest_tool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_manifest_tool"
path = "src/lib.rs"

[[bin]]
name = "robin-highscores-manifestctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bitcode.workspace = true
clap = { version = "4", features = ["derive"] }
fastrand.workspace = true
goblin = "0.10"
memchr = "2"
nix_legacy = { package = "nix", version = "0.29", features = ["fs"] }
robin_assets.workspace = true
robin_official_content.workspace = true
robin_engine.workspace = true
robin_run_protocol.workspace = true
rustix = { version = "1", features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
toml = "1.1"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"
