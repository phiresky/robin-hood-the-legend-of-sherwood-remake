[package]
name = "robin_parity"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "original_parity_replay"
path = "src/bin/original_parity_replay.rs"

[features]
default = []
# Interactive visualization, frame-zero screenshots, and the HTTP debugger use
# the complete game client. Corpus validation stays CPU-only by default.
client = ["dep:robin_rs"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
base64.workspace = true
# Authoritative v68 trace bytes are frozen to this release independently of
# the shipping codec's git revision. See docs/TESTING.md, "Wire format freezes".
bitcode_parity = { package = "bitcode", version = "=0.6.9", features = ["serde"] }
fs2.workspace = true
png.workspace = true
robin_assets.workspace = true
robin_util.workspace = true
robin_engine = { workspace = true, features = ["original-parity"] }
robin_rs = { path = "../robin_rs", optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zstd.workspace = true

[lints]
workspace = true
