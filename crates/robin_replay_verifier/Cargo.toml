[package]
name = "robin_replay_verifier"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_replay_verifier"

[[bin]]
name = "robin-replay-verifier"
path = "src/bin/robin-replay-verifier.rs"

[dependencies]
mimalloc.workspace = true
clap = { workspace = true, features = ["derive"] }
nix = { workspace = true, features = ["resource"] }
robin_engine.workspace = true
robin_replay_format.workspace = true
robin_ranked_verification.workspace = true
robin_run_protocol = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
bitcode.workspace = true
tempfile.workspace = true

[lints]
workspace = true
