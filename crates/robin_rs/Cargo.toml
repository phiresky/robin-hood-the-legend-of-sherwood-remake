[package]
name = "robin_rs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_rs"
# Native and wasm development use the library as an `rlib`; the wasm build's
# actual artifact is the `robin` binary. Android packaging requests `cdylib`
# explicitly via `cargo rustc` so normal builds and tests do not also link an
# unused host shared library.
crate-type = ["rlib"]

[dependencies]
robin_engine.workspace = true
robin_assets.workspace = true
robin_util.workspace = true
tempfile.workspace = true
ab_glyph = "0.2"
geo = { workspace = true, features = ["serde"] }
earcutr = "0.5"
bitflags = { workspace = true, features = ["serde"] }
enum-map = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde_urlencoded = "0.7"
serde-value = "0.7"
tracing.workspace = true
thiserror.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
jiff = "0.2"
fastrand.workspace = true
rand = "0.10"
anyhow.workspace = true
futures = "0.3"
libc = "0.2"
bytemuck = { workspace = true, features = ["derive"] }
clap = { version = "4", features = ["derive"] }
dirs = { version = "6", optional = true }
ffmpeg-next = { version = "9", optional = true }
png = "0.18"
bitcode.workspace = true
zstd.workspace = true
base64 = "0.22"
sha2 = "0.11"
# Zip-backed custom missions are compiled on wasm too. Browser builds do not
# currently mount host paths, but the shared picker/launch code still needs the
# archive reader and in-memory overlay types to type-check.
zip.workspace = true
# Windowing + input
winit = { version = "0.30", features = ["android-native-activity", "serde"] }
gilrs = "0.11"

# GPU.  `webgl` enables wgpu's WebGL2 backend so wasm builds work on
# browsers that don't yet expose WebGPU (most non-Chrome desktops as
# of 2026).  Adds a few KiB to native; harmless to keep on.
# `static-dxc` links DXC into the exe so the DX12 backend can compile
# shader-model-6 features (our binding_array needs SM5.1+, which the FXC
# fallback cannot do); only affects Windows targets.
wgpu = { version = "30", features = ["webgl", "glsl", "static-dxc"] }
pollster = "1.0"

# Audio
kira = { version = "0.12", optional = true }
# Spatial-audio coords for kira (kira's spatial API takes mint::Vector3 /
# Quaternion; glam types convert via mint compat). We talk to it directly
# in mint to avoid pulling glam in as a direct dep.
mint = { version = "0.5", optional = true }

# Async plumbing for the ApplicationHandler ↔ game-loop bridge.
# The whole game loop is `async fn`; on native it runs on a dedicated
# `std::thread` driven by `pollster::block_on`, on wasm it's a
# `wasm_bindgen_futures::spawn_local` future on the main thread.
async-channel = "2"
# `web-time` is a drop-in replacement for `std::time::{Instant, SystemTime}`
# that uses `performance.now()` on wasm and the std types on native.
# `std::time::Instant::now()` panics on `wasm32-unknown-unknown`.
web-time.workspace = true

# Native-only runtime integrations (Lua, filesystem/process services, and
# networking). Browser equivalents live behind wasm-bindgen APIs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
robin_lua.workspace = true
mlua.workspace = true
fs2 = "0.4"
librashader = { version = "0.12", default-features = false, features = ["presets", "runtime-wgpu", "stable"], optional = true }
tiny_http = "0.12"
# Multiplayer transport: peer-to-peer QUIC with relay fallback and
# hole punching.  Peers are addressed by their public-key endpoint id,
# so no port forwarding or bind-address configuration is needed.
iroh = "1.0.3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time", "io-util"] }
# Non-poisoning mutexes for the multiplayer peer state shared across
# transport worker threads.
parking_lot = "0.12"
# Real memory / CPU-frequency queries for the options-menu hardware line.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Serverless matchmaking: hosts announce games on a well-known
# iroh-gossip topic whose peers are found through the BitTorrent
# Mainline DHT (distributed-topic-tracker) — no broker, no
# configuration.  The DHT address lookup additionally lets endpoint
# ids resolve without any hosted DNS/relay-discovery infrastructure.
# ed25519-dalek matches the SigningKey type distributed-topic-tracker
# expects (built from the iroh SecretKey bytes).
iroh-gossip = { version = "0.101", features = ["net"] }
distributed-topic-tracker = "0.3.5"
ed25519-dalek = "3.0.0-rc.0"
iroh-mainline-address-lookup = "0.4"

# Desktop installer/update lifecycle hooks. Keep this target-scoped so the
# Android cdylib and browser build do not pull in desktop packaging support.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
semver = "1"
velopack = "1.2.0"
# Native folder-picker / message dialogs for the startup datadir selector.
rfd = "0.15"

# GUI-subsystem binaries have no console; re-attach to the parent process
# console so logs still reach the terminal when launched from one.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "android")'.dependencies]
# Direct JNI calls let android_main ask the Java Activity to leave the
# Android task before we hard-exit the process for winit's single-EventLoop
# limitation.
jni = "0.22.4"

# Wasm-only: wasm-bindgen + web-sys glue, plus a JS-backed timer for
# async pacing inside the game loop.  Single-threaded — no `wasm-bindgen-rayon`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Location",
    "Performance",
    "Response",
    "Storage",
    "Url",
    "UrlSearchParams",
] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-render = "0.3"
# Enable `crypto.getRandomValues` for the `getrandom` major version
# used by the wasm dependency graph.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
qoi = "0.4"
robin_engine = { workspace = true, features = ["test-helpers"] }
# The parity-native v67 wire format is authoritative and remains on 0.6.9.
# Only the parity example needs it; production game formats use the workspace
# codec and should not compile two bitcode packages.
bitcode_parity = { package = "bitcode", version = "=0.6.9", features = ["serde"] }
fs2 = "0.4"

[features]
default = ["native-fs", "audio", "video"]
android = ["audio"]
audio = ["dep:kira", "dep:mint"]
# Cutscene video playback (Intro/Outro.ogg).  Pulls in ffmpeg-next,
# which does not build on wasm32 — wasm builds turn the default
# features off and re-enable selectively. Android builds should do the
# same for now; ffmpeg packaging is TODO once the native APK boots.
video = ["dep:ffmpeg-next", "audio"]
# Standard filesystem-backed save / replay directory resolution via the
# `dirs` crate.  Disabled on wasm where saves/replays go through a
# browser-side mechanism instead of OS data dirs.
native-fs = ["dep:dirs"]
# RetroArch .slangp shader-preset support via librashader.  Off by default:
# librashader pulls in glslang + SPIRV-Cross (C++), which on windows-gnu
# makes the exe depend on libstdc++-6.dll.
retroarch-shaders = ["dep:librashader"]

[[bin]]
name = "robin"
path = "src/bin/robin.rs"
test = false

# This diagnostic binary has no unit tests. Declaring it explicitly keeps
# `cargo test` from compiling and linking an empty test harness for it.
[[bin]]
name = "dump_level"
path = "src/bin/dump_level.rs"
test = false
