[package]
name = "robin_rs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "robin_rs"
# Native and wasm development use the library as an `rlib`; the wasm build's
# actual artifact is the `robin` binary. Android packaging requests `cdylib`
# explicitly via `cargo rustc` so normal builds and tests do not also link an
# unused host shared library.
crate-type = ["rlib"]

[dependencies]
robin_engine.workspace = true
robin_assets.workspace = true
robin_replay_format.workspace = true
robin_run_protocol = { workspace = true, features = ["authentication"] }
robin_util.workspace = true
tempfile.workspace = true
ab_glyph = "0.2"
geo = { workspace = true, features = ["serde"] }
earcutr = "0.5"
bitflags = { workspace = true, features = ["serde"] }
enum-map = { workspace = true, features = ["serde"] }
indexmap.workspace = true
smallvec.workspace = true
lru = { version = "0.18.4", optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_urlencoded = "0.7"
percent-encoding = "2.3"
url.workspace = true
tracing.workspace = true
thiserror.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Browser save metadata needs both the JavaScript wall clock and browser local
# time zone. The `js` feature is inert on native targets.
jiff = { version = "0.2", features = ["js"] }
sys-locale = { version = "0.3", features = ["js"] }
fastrand.workspace = true
rand.workspace = true
anyhow.workspace = true
futures = "0.3"
libc.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
# Playback needs demuxing/decoding, scaling, and resampling—not device capture
# or filter graphs, whose native dependencies also burden isolated workers.
ffmpeg-next = { version = "9", optional = true, default-features = false, features = ["format", "software-resampling", "software-scaling"] }
png.workspace = true
bitcode.workspace = true
zstd.workspace = true
base64.workspace = true
sha2 = "0.11"
hex = "0.4"
ed25519-dalek.workspace = true
# Zip-backed custom missions are compiled on wasm too. Browser builds do not
# currently mount host paths, but the shared picker/launch code still needs the
# archive reader and in-memory overlay types to type-check.
zip.workspace = true
# Windowing + input
winit = { version = "0.30", features = ["android-native-activity", "serde"] }
gilrs = { version = "0.11", optional = true }

pollster = "1.0"

# Async plumbing for the ApplicationHandler ↔ game-loop bridge.
# The whole game loop is `async fn`; on native it runs on a dedicated
# `std::thread` driven by `pollster::block_on`, on wasm it's a
# `wasm_bindgen_futures::spawn_local` future on the main thread.
async-channel = "2"
# `web-time` is a drop-in replacement for `std::time::{Instant, SystemTime}`
# that uses `performance.now()` on wasm and the std types on native.
# `std::time::Instant::now()` panics on `wasm32-unknown-unknown`.
web-time.workspace = true
robin_spellforge.workspace = true
unicode-segmentation.workspace = true

# Native-only runtime integrations (Lua, filesystem/process services, and
# networking). Browser equivalents live behind wasm-bindgen APIs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
robin_replay_format = { workspace = true, features = ["native-admission"] }
# OS data directories are standard for every native build.
dirs = "7"
robin_official_content = { workspace = true, optional = true }
robin_lua = { workspace = true, optional = true }
mlua = { workspace = true, optional = true }
rayon = { version = "1", optional = true }
ogg = { version = "0.9.2", optional = true }
# Keep Kira's complete native decoder/backend feature set. Native installs can
# point at user-supplied data directories, so restricting their accepted audio
# formats would be an unnecessary compatibility regression.
kira = { version = "0.12", optional = true }
# Spatial-audio coordinates for Kira. Web Audio uses StereoPannerNode.
mint = { version = "0.5", optional = true }
fs2.workspace = true
librashader = { version = "0.12", default-features = false, features = ["presets", "runtime-wgpu", "stable"], optional = true }
walkdir = { version = "2.5", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = "0.1"
# Multiplayer transport: peer-to-peer QUIC with relay fallback and
# hole punching.  Peers are addressed by their public-key endpoint id,
# so no port forwarding or bind-address configuration is needed.
iroh = { version = "1.1.0", default-features = false, features = ["tls-ring", "portmapper"], optional = true }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time", "io-util"] }
# Non-poisoning mutexes for the multiplayer peer state shared across
# transport worker threads.
parking_lot = { version = "0.12", optional = true }
# Real memory / CPU-frequency queries for the options-menu hardware line.
sysinfo = { version = "0.39", default-features = false, features = ["system"], optional = true }
# Serverless matchmaking: hosts announce games on a well-known
# iroh-gossip topic whose peers meet through BEP-44 mutable records on
# the BitTorrent Mainline DHT (`multiplayer::rendezvous`) — no broker,
# no configuration.  The DHT address lookup additionally lets endpoint
# ids resolve without any hosted DNS/relay-discovery infrastructure.
iroh-gossip = { version = "0.101", default-features = false, features = ["net"], optional = true }
mainline = { version = "8", optional = true }
iroh-mainline-address-lookup = { version = "0.5", optional = true }
# Leaderboard requests run on bounded background workers. Redirects are
# disabled because signed replay-bearing POST bodies must never be forwarded
# to an origin other than the one selected by the client.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider", "json", "multipart"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }

# Compile only the GPU backends usable on each native target. In particular,
# Linux builds do not need the DX12/Metal/WebGPU feature graph.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl", "glsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "gles", "wgsl", "glsl", "static-dxc"] }
# GUI-subsystem binaries have no console; re-attach to the parent process
# console so logs still reach the terminal when launched from one.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "metal", "gles", "wgsl", "glsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tiny_http = "0.12"
# Legacy direct-call adapter conformance lives only in focused unit tests.
# Gameplay on every platform uses robin_spellforge's one pure-Rust VM.
robin_lua.workspace = true
mlua.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

# Desktop installer/update lifecycle hooks. Keep this target-scoped so the
# Android cdylib and browser build do not pull in desktop packaging support.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
semver = { version = "1", optional = true }
velopack = { version = "1.2.0", optional = true }
# Native folder-picker / message dialogs for the startup datadir selector.
rfd = { version = "0.17", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Direct JNI calls let android_main ask the Java Activity to leave the
# Android task before we hard-exit the process for winit's single-EventLoop
# limitation.
jni = "0.22.4"

# Wasm-only: wasm-bindgen + web-sys glue, plus a JS-backed timer for
# async pacing inside the game loop.  Single-threaded — no `wasm-bindgen-rayon`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser runtime explicitly requests the WebGL backend and all in-tree
# shaders are WGSL. Avoid wgpu's defaults here: they also enable WebGPU and
# native backend features that cannot be selected by this runtime.
wgpu = { workspace = true, default-features = false, features = ["std", "webgl", "wgsl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "FormData",
    "GainNode",
    "Headers",
    "HtmlElement",
    "HtmlCanvasElement",
    "Location",
    "Navigator",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "Storage",
    "StorageManager",
    "StereoPannerNode",
    "Url",
    "UrlSearchParams",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "stream"] }
# Must match reqwest's wasm-streams: two versions export duplicate wasm-bindgen
# symbols at link time even when `cargo check` succeeds.
wasm-streams = "0.5"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
gloo-timers = { version = "0.4", features = ["futures"] }
# Durable, transactional browser storage for immutable full-mod envelopes and
# resumable prefixes.  localStorage remains reserved for the tiny identity and
# trust records.
rexie = "0.6.2"
gloo-render = "0.3"
# Enable `crypto.getRandomValues` for the `getrandom` major version
# used by the wasm dependency graph.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# Browser endpoints use iroh's built-in relay-over-WebSocket transport. Native
# discovery remains target-scoped above; browser joins use a signed relay URL.
iroh = { version = "1.1.0", default-features = false, features = ["tls-ring"], optional = true }

[dev-dependencies]
robin_test_support.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
qoi = "0.4"
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
robin_engine = { workspace = true, features = ["test-helpers"] }

[build-dependencies]
cc = "1"
sha2.workspace = true

[features]
# Bare builds are intentionally dependency-minimal. Opt into the normal native
# game with `desktop`, or select individual integrations as needed.
default = []
desktop = ["audio", "dialogs", "gamepad", "hardware-info", "script-rpc"]
script-rpc = ["dep:hyper", "dep:hyper-util"]
# Packaged desktop builds retain the integrations they can currently ship.
release = ["desktop", "lua", "multiplayer", "auto-update"]
# Every supported native integration. FFmpeg packaging is not yet available on
# every release target, so the release workflow uses `release` for now.
full = ["release", "video", "retroarch-shaders"]
# Native/browser iroh transport, signed join tickets, and DHT/gossip
# matchmaking. Local play and rollback replay use only robin_engine channels.
multiplayer = [
    "dep:iroh",
    "dep:parking_lot",
    "dep:iroh-gossip",
    "dep:mainline",
    "dep:iroh-mainline-address-lookup",
]
# Developer conversion/inspection binaries are built only on demand.
tools = ["dep:ogg", "dep:rayon"]
android = ["audio"]
audio = ["dep:kira", "dep:lru", "dep:mint", "dep:ogg"]
dialogs = ["dep:rfd"]
gamepad = ["dep:gilrs"]
hardware-info = ["dep:sysinfo"]
# Cutscene video playback (Intro/Outro.ogg).  Pulls in ffmpeg-next,
# which does not build on wasm32 — wasm builds turn the default
# features off and re-enable selectively. Android builds should do the
# same for now; ffmpeg packaging is TODO once the native APK boots.
video = ["dep:ffmpeg-next", "audio"]
# Legacy native Luau tools/tests and the native host-session compatibility surface.
# Gameplay Spellforge execution always uses robin_spellforge, with or without this feature.
lua = ["dep:robin_lua", "dep:mlua"]
# Closed, native-only feature for the reproducible official-content projection
# executable. It intentionally stays out of every shipping client graph.
projection-export = ["dep:robin_official_content"]
# Installed desktop builds can opt into Velopack startup and background update
# checks. Developer builds do not need its HTTP and packaging dependency graph.
auto-update = ["dep:semver", "dep:velopack"]
# RetroArch .slangp shader-preset support via librashader. This pulls in
# glslang + SPIRV-Cross; Windows GNU packages must ship libstdc++-6.dll.
retroarch-shaders = ["dep:librashader", "dep:walkdir"]
# Browser worker-pool build: parallel VQ sprite decode at mission install via
# wasm-bindgen-rayon.  Requires the atomics/shared-memory build produced by
# scripts/build-wasm-threads.sh; the plain wasm build must not enable this.
wasm-threads = ["robin_assets/wasm-threads"]

[[bin]]
name = "robin"
path = "src/bin/robin.rs"
test = false

# This diagnostic binary has no unit tests. Declaring it explicitly keeps
# `cargo test` from compiling and linking an empty test harness for it.
[[bin]]
name = "dump_level"
path = "src/bin/dump_level.rs"
test = false
required-features = ["tools"]

[[bin]]
name = "convert_datadir"
path = "src/bin/convert_datadir.rs"
# Its unit tests run explicitly with --bin convert_datadir; see docs/TESTING.md.
test = false
required-features = ["tools"]

[[example]]
name = "export_simulation_content"
path = "examples/export_simulation_content.rs"
required-features = ["projection-export"]

[lints]
workspace = true

[[example]]
name = "run_script"
test = true

[[example]]
name = "batch_run"
test = true

# Operational codec probes are built on demand. Run their tests explicitly
# with --example rather than adding research code to the default client suite.
[[example]]
name = "sprite_size_bench"
test = false

[[example]]
name = "sprite_compression_probe"
test = false

[[example]]
name = "verify_rollback"
test = true

[[example]]
name = "pak_res_roundtrip"
test = true

[[example]]
name = "jxl_map_roundtrip"
test = true
